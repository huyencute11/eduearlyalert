# Theme chung cho dashboard EduEarlyAlert (streamlit run app/dashboard.py)
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f3f6"
textColor = "#0b0b0b"
borderColor = "#e3e5e8"
showWidgetBorder = true
baseRadius = "medium"
font = "sans-serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
