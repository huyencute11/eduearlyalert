# =============================================================================
# KNOWLEDGE GRAPH – DỮ LIỆU MÔ PHỎNG (SYNTHETIC)
# Nhóm 3 tự xây dựng để minh hoạ ánh xạ Concept–CLO–Resource.
# KHÔNG phải chương trình đào tạo thật của Open University hay của trường.
